name: Build GOTY
on:
  push:
    branches:
      - archipelago

jobs:
  build:
    runs-on: windows-latest
    strategy: 
      fail-fast: false
      matrix:
        configuration: [ReleaseGOTY, DebugGOTY]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with: 
          submodules: recursive
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: msbuild
        run: |
          msbuild /p:Configuration=${{ matrix.configuration }} /p:Platform=x86 PlantsVsZombies.sln
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PlantsVsZombies-GOTY-${{ matrix.configuration }}
          path: |
            Output