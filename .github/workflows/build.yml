name: Build GOTY
on:
  push:
    branches:
      - archipelago

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: msbuild
        run: |
          msbuild /p:Configuration=ReleaseGOTY /p:Platform=x86 PlantsVsZombies.sln
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: PlantsVsZombies-GOTY
          path: |
            Output